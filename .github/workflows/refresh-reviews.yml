name: Refresh Google review count

# Reads the current Google rating + review count from the public Google Maps listing
# (headless Chromium, see scripts/refresh-reviews.py) and commits data/reviews.json
# when it changes. The push then auto-builds on Netlify. On a failed read the file is
# left untouched (last-good stays live) BUT the run fails, so GitHub emails the owner.
# No API key or secret needed.

on:
  workflow_dispatch:        # manual runs
  schedule:
    - cron: '0 7 * * 1'     # weekly, Mondays 07:00 UTC

permissions:
  contents: write           # allow the job to push the updated reviews.json

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless Chromium
        run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium

      - name: Refresh reviews.json
        run: python scripts/refresh-reviews.py --out data/reviews.json

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-debug
          path: reviews-debug.*
          if-no-files-found: ignore

      - name: Commit if the number changed
        run: |
          if git diff --quiet -- data/reviews.json; then
            echo "No change — reviews.json is already current."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/reviews.json
            git commit -m "chore: refresh Google review count"
            git push
            echo "Pushed updated reviews.json."
          fi
